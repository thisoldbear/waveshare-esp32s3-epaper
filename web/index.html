<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#181818" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>The Dark Wood</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="emulator-viewport">
      <div class="device-casing">
        <!-- E-Paper Screen Frame -->
        <div class="screen-frame">
          <canvas
            id="epaper-canvas"
            width="200"
            height="200"
            class="epaper-canvas"
          ></canvas>
        </div>

        <!-- Controls: Two Large Thumb Buttons -->
        <div class="controls-panel">
          <button id="btn-boot" type="button" class="retro-btn">
            <span class="btn-sub">BOOT</span>
            <span id="btn-boot-label" class="btn-action">ENTER</span>
          </button>
          <button id="btn-pwr" type="button" class="retro-btn">
            <span class="btn-sub">PWR</span>
            <span id="btn-pwr-label" class="btn-action">ENTER</span>
          </button>
        </div>

        <!-- Device Status Bar -->
        <div class="device-bar">
          <div class="status-indicator">
            <span id="status-led" class="status-dot"></span>
            <span class="status-text">BUSY</span>
          </div>
          <button id="btn-sound" type="button" class="sound-toggle">SOUND: ON</button>
        </div>
      </div>
    </div>
    <script src="./bundle.js"></script>
  </body>
</html>
